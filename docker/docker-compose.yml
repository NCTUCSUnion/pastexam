name: pastexam

services:
  frontend:
    image: ghcr.io/nctucsunion/pastexam:frontend
    container_name: pastexam-frontend
    restart: always
    # ports:
    #   - "5173:80"
    networks:
      app_network:
        aliases:
          - frontend

  backend:
    image: ghcr.io/nctucsunion/pastexam:backend
    container_name: pastexam-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_started
    # ports:
    #   - "8000:8000"
    env_file:
      - ../backend/.env
    networks:
      app_network:
        aliases:
          - backend

  worker:
    image: ghcr.io/nctucsunion/pastexam:backend
    container_name: pastexam-worker
    restart: always
    command: arq app.worker.WorkerSettings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_started
    env_file:
      - ../backend/.env
    networks:
      - app_network

  db:
    image: postgres:15.14-alpine3.22
    container_name: pastexam-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: pastexam-rustfs
    restart: always
    # ports:
    #   - "9000:9000"
    #   - "9001:9001" # 9000 for S3 API, 9001 for RustFS Console
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      app_network:
        aliases:
          - rustfs

  redis:
    image: redis:7.4.5-alpine3.21
    container_name: pastexam-redis
    restart: always
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  nginx:
    image: nginx:1.29.2
    container_name: pastexam-nginx
    restart: always
    ports:
      # Only the host nginx (HTTPS) should reach this port
      - "127.0.0.1:8080:8080"
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - rustfs
    networks:
      - app_network

networks:
  app_network:
    name: pastexam-network
    driver: bridge

volumes:
  pg_data:
    name: pastexam-postgres-data
  rustfs_data:
    name: pastexam-rustfs-data
  redis_data:
    name: pastexam-redis-data
