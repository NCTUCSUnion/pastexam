name: Deploy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_DIRECTORY }}
            # Bring compose files, nginx config and scripts to the commit being deployed;
            # stops here if the server checkout has local changes
            REPO_DIR=$(git rev-parse --show-toplevel)
            git -C "$REPO_DIR" fetch --quiet origin main
            git -C "$REPO_DIR" merge --ff-only --quiet ${{ github.sha }}
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi
            docker compose pull
            docker compose up -d
            docker compose restart nginx
            # Fail the deploy (instead of reporting success) if the backend does not come
            # up. Asks the container directly, so it works whatever compose file is on the
            # server. Migrations run at startup, so allow a few minutes.
            ok=no
            for _ in $(seq 1 36); do
              if docker exec pastexam-backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/statistics', timeout=5)" >/dev/null 2>&1; then
                ok=yes
                break
              fi
              sleep 5
            done
            if [ "$ok" != yes ]; then
              # Backend logs stay on the server (docker compose logs backend): CI logs are public
              echo "Backend did not respond after deploy"
              docker ps --filter name=pastexam-backend --format '{{.Names}}: {{.Status}}'
              exit 1
            fi
